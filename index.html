<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لوحة تحليل المعلومات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f6;--card:#fff;--tx:#12292c;--mu:#5c797b;--ac:#2f8f89;--ac2:#123039;--bd:#d7e6e5;--sea:#dcedef;--land:#eef3ee;--hd1:#3c908c;--hd2:#10343c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1a;--card:#16221f;--tx:#e6f1ef;--mu:#93b1ae;--ac:#4fc8bf;--ac2:#9fc3c9;--bd:#254240;--sea:#0f2a2e;--land:#16302f;--hd1:#1f6d69;--hd2:#0a1f24}}
:root[data-theme="dark"]{--bg:#101a1a;--card:#16221f;--tx:#e6f1ef;--mu:#93b1ae;--ac:#4fc8bf;--ac2:#9fc3c9;--bd:#254240;--sea:#0f2a2e;--land:#16302f;--hd1:#1f6d69;--hd2:#0a1f24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;padding:12px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:12px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.k,.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.k b{display:block;font-size:24px;color:var(--ac)}.k span{font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.c{height:340px;display:flex;flex-direction:column}.c.mp{height:560px}.bd{flex:1;min-height:0;overflow:auto}.w{grid-column:1/-1}svg text.ml{fill:var(--tx);font-size:10px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}#mp text{pointer-events:none}#mp polygon{cursor:pointer}
.c h2{font-size:14px;margin:0 0 8px}.sc{max-height:460px;overflow-y:auto}
.r{display:grid;grid-template-columns:120px 1fr 64px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.r i{display:block;height:12px;border-radius:6px;background:var(--bd);overflow:hidden}.r i u{display:block;height:100%;background:var(--ac)}
.r em{font-style:normal;color:var(--mu);text-align:start;font-size:11px}
.q{flex:1;min-width:200px;background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}.w{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:start}th{color:var(--mu)}svg text{fill:var(--mu);font-size:10px}.n{font-size:11px;color:var(--mu);margin-top:6px}.c h2{display:flex;justify-content:space-between;align-items:center;gap:6px}.e,.up{cursor:pointer;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap}.up{font-size:13px;padding:7px 10px;border-radius:8px;border-color:var(--ac)}.hd{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:10px}.hd img{height:54px;width:auto}.hd h1{margin:0;font-size:22px;font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:900}.hd .sub{color:#cdeae6;margin:3px 0 0}.mp .bd{position:relative}.zc{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:2}.zc button{width:30px;height:30px;font-size:16px;padding:0}.lg{display:inline-block;width:80px;height:8px;border-radius:4px;vertical-align:middle;background:linear-gradient(90deg,transparent,var(--ac)),var(--land)}#mp{cursor:grab}@media(max-width:600px){body{padding:8px}.hd{padding:10px 12px;gap:10px}.hd img{height:42px}.hd h1{font-size:17px}.hd .sub{font-size:11px}
.bar>*{flex:1 1 44%;min-height:40px}.bar .q{flex:1 1 100%}select,.q,button,.up{font-size:16px}.e{font-size:12px;min-height:30px;padding:4px 10px}
.kpis{grid-template-columns:repeat(2,1fr)}.kpis .k:last-child:nth-child(odd){grid-column:1/-1}.k b{font-size:22px}
.c{height:auto}.c .bd{max-height:380px}.c.mp{height:auto}.c.mp .bd{height:420px;max-height:none}.c h2{flex-wrap:wrap}
.r{grid-template-columns:96px 1fr 62px}.zc button{width:38px;height:38px;font-size:18px}svg text.ml{font-size:13px}svg.zo .mv{display:none}
input[type=range]{width:110px}}
#mp{touch-action:none}#lm{position:absolute;inset:0;visibility:hidden;z-index:1;border-radius:8px}.lb{background:transparent;border:0;box-shadow:none;font-weight:700;font-size:11px;color:#111;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}.lb:before{display:none}.tp{position:absolute;display:none;z-index:3;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:240px}#mp path[data-mi]:hover,#mp ellipse[data-mi]:hover{stroke:var(--ac2);stroke-width:3}.dz{border:2px dashed var(--ac);border-radius:12px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;background:var(--card);margin-bottom:10px}.dz.drag{background:var(--sea)}.dz b{color:var(--tx)}.badge{display:inline-block;background:var(--bd);color:var(--tx);border-radius:6px;padding:1px 7px;font-size:11px;margin-inline-start:6px}.warn{background:var(--card);border:1px solid #d99;color:#a33;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:10px}@media(prefers-color-scheme:dark){.warn{color:#f3a}}.tbl-wrap{overflow:auto;max-height:420px}</style></head><body>

/* ---------- parsing ---------- */
function findHeaderRow(aoa){
  let best=0,bestScore=-1e9;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    const row=aoa[i];if(!row||!row.length)continue;
    let str=0,num=0,ne=0;
    row.forEach(c=>{if(c===''||c==null)return;ne++;if(typeof c==='number'||c instanceof Date)num++;else str++});
    if(ne<2)continue;
    const score=str-num*2+ne*0.15;
    if(score>bestScore){bestScore=score;best=i}
  }
  return best;
}
function parseWorkbook(wb){
  const names=wb.SheetNames.filter(n=>{const s=wb.Sheets[n];return s&&s['!ref']});
  let bestSheet=names[0],bestCells=0;
  names.forEach(n=>{const s=wb.Sheets[n],aoa=XLSX.utils.sheet_to_json(s,{header:1,defval:'',raw:true});const cells=aoa.reduce((a,r)=>a+r.filter(c=>c!==''&&c!=null).length,0);if(cells>bestCells){bestCells=cells;bestSheet=n}});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[bestSheet],{header:1,defval:'',raw:true});
  const hi=findHeaderRow(aoa);
  const headers=aoa[hi].map((c,i)=>{const s=(c==null?'':String(c).trim());return s||('عمود '+(i+1))});
  const seen={};
  const H=headers.map(h=>{if(seen[h]==null){seen[h]=0;return h}seen[h]++;return h+' ('+(seen[h]+1)+')'});
  const rows=aoa.slice(hi+1).filter(r=>r&&r.some(c=>c!==''&&c!=null)).map(r=>{const o=r.slice(0,H.length);while(o.length<H.length)o.push('');return o});
  return{headers:H,rows,sheet:bestSheet};
}
function parseNum(v){
  if(typeof v==='number')return v;
  if(v==null)return null;
  const s=String(v).trim();if(!s)return null;
  const pct=s.includes('%');
  const cleaned=s.replace(/[%\s,]/g,'');
  if(!/^-?\d+(\.\d+)?$/.test(cleaned))return null;
  const n=parseFloat(cleaned);
  return pct?n/100:n;
}
function classify(headers,rows){
  return headers.map((h,ci)=>{
    const raw=rows.map(r=>r[ci]).filter(v=>v!==undefined&&v!==null&&String(v).trim()!=='');
    const total=raw.length;
    if(!total)return{name:h,idx:ci,type:'empty'};
    let dateC=0,numC=0,fracC=0;const nums=[];
    raw.forEach(v=>{
      if(v instanceof Date){dateC++;return}
      if(typeof v==='number'){numC++;nums.push(v);if(v>=0&&v<=1)fracC++;return}
      const s=String(v).trim();
      if(/^\d{4}-\d{1,2}(-\d{1,2})?$/.test(s)||/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){dateC++;return}
      const n=parseNum(s);
      if(n!==null){numC++;nums.push(n);if(s.includes('%')||(n>=0&&n<=1))fracC++}
    });
    const distinctSet=new Set(raw.map(v=>v instanceof Date?v.getTime():String(v).trim()));
    const distinct=distinctSet.size;
    if(dateC/total>0.6)return{name:h,idx:ci,type:'date'};
    if(numC/total>0.6){
      const isPct=fracC/numC>0.5;
      return{name:h,idx:ci,type:isPct?'percent':'number',min:Math.min(...nums),max:Math.max(...nums)};
    }
    if(distinct<=30||distinct/total<0.5)return{name:h,idx:ci,type:'category',distinct};
    return{name:h,idx:ci,type:'text',distinct};
  });
}
function getDate(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='string'){const m=v.match(/(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);if(m)return new Date(+m[1],+m[2]-1,+(m[3]||1));const m2=v.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m2)return new Date(+m2[3],+m2[2]-1,+m2[1])}return null}
function getNum(v){return typeof v==='number'?v:parseNum(v)}
function getCat(v){return v==null?'':String(v).trim()}

/* ---------- dataset load ---------- */
function loadDataset(headers,rows,name){
  const cols=classify(headers,rows);
  DS={headers,rows,cols,name};
  f={};CU=[];svCU();
  try{
    const small=rows.length<=3000;
    if(small)localStorage.setItem('gd_data',JSON.stringify({headers,rows:rows.map(r=>r.map(v=>v instanceof Date?v.toISOString():v)),name}));
  }catch(_){}
  $('ttl').textContent='لوحة تحليل البيانات';
  $('src').textContent='الملف: '+name+' — '+rows.length+' صف، '+headers.length+' عمود';
  renderAll();
}

/* ---------- filtering ---------- */
function catCols(){return DS.cols.filter(c=>c.type==='category')}
function numCols(){return DS.cols.filter(c=>c.type==='number'||c.type==='percent')}
function filteredRows(){
  const q=($('q')&&$('q').value||'').trim().toLowerCase();
  return DS.rows.filter(r=>{
    for(const k in f){if(f[k]!==''&&getCat(r[k])!==f[k])return false}
    if(!q)return true;
    return r.some(v=>String(v==null?'':v).toLowerCase().includes(q));
  });
}

/* ---------- forecast ---------- */
function pickForecastCol(){
  const kw=['نسبة','تقدم','انجاز','إنجاز','progress','percent','completion'];
  let p=DS.cols.find(c=>c.type==='percent'&&kw.some(k=>c.name.toLowerCase().includes(k)));
  if(!p)p=DS.cols.find(c=>c.type==='percent');
  if(!p)p=DS.cols.find(c=>c.type==='number');
  return p;
}
function pickDateCol(){
  const kw=['تاريخ','date','start','due','target','deadline','موعد'];
  let d=DS.cols.find(c=>c.type==='date'&&kw.some(k=>c.name.toLowerCase().includes(k)));
  if(!d)d=DS.cols.find(c=>c.type==='date');
  return d;
}
function fcValue(col,v){
  if(col.type==='percent')return Math.max(0,Math.min(1,getNum(v)||0));
  const n=getNum(v);if(n==null)return 0;
  const span=(col.max-col.min)||1;
  return Math.max(0,Math.min(1,(n-col.min)/span));
}
function renderForecast(rs){
  const pc=pickForecastCol();
  const box=$('fcbox');
  if(!pc){box.innerHTML='<div class="n">لا يوجد عمود رقمي (نسبة إنجاز أو ما شابه) في هذا الملف لعمل تنبؤ.</div>';delete EX.fc;return}
  const dc=pickDateCol();
  const vals=rs.map(r=>fcValue(pc,r[pc.idx]));
  const n=rs.length||1;
  const r=FC.rate/100,L=FC.lag,H=12;

  }
  const now=new Date();

  const pr=(p0,k,d)=>{
    if(p0>=1)return 1;
    if(p0>0)return Math.min(1,p0+r*k);
    let delay=L;
    if(d){const months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());delay=Math.max(0,L-months)}
    return k>delay?Math.min(1,r*(k-delay)):0;
  };
  const st=k=>{let s=0,c=0;vals.forEach((p0,i)=>{const d=baseDates?baseDates[i]:null;const p=pr(p0,k,d);s+=p;if(p>=1)c++});return[s/n*100,c]};
  const av=[],dn=[];for(let k=0;k<=H;k++){const z=st(k);av.push(z[0]);dn.push(z[1])}
  let kA=-1;for(let k=0;k<=240;k++)if(st(k)[1]==n){kA=k;break}
  const dp=dn.map(c=>c/n*100);
  const X0=k=>35+k*(550/H),Y=v=>165-v*1.45,P=a=>a.map((v,k)=>X0(k).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  EX.fc={n:'تنبؤ',rows:[['الشهر','متوسط %','نسبة مكتملة %','عدد مكتمل']].concat(lb.map((l,k)=>[l,Math.round(av[k]*10)/10,Math.round(dp[k]*10)/10,dn[k]]))};
  const svg='<svg viewBox="0 0 600 190" style="width:100%">'+[0,50,100].map(v=>'<line x1="35" x2="585" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="30" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'%</text>').join('')+'<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+P(av)+'"/><polyline fill="none" stroke="var(--ac2)" stroke-width="2.5" stroke-dasharray="5 4" points="'+P(dp)+'"/>'+[0,6,12].map(k=>'<text x="'+X0(k)+'" y="182" text-anchor="'+(k==0?'start':k==12?'end':'middle')+'">'+lb[k]+'</text>').join('')+'<text x="'+(X0(0)+4)+'" y="'+(Y(av[0])-6)+'">'+Math.round(av[0])+'%</text><text x="'+X0(H)+'" y="'+(Y(av[H])-6)+'" text-anchor="end">'+Math.round(av[H])+'%</text></svg>';
  const note='<span style="color:var(--ac)">━ متوسط '+pc.name+'</span> · <span style="color:var(--ac2)">┅ نسبة مكتمل 100%</span><br>بعد 12 شهراً: المتوسط ≈'+Math.round(av[H])+'% ويكتمل '+dn[H]+' من '+n+(kA>=0?'، وتكتمل الكل خلال ≈'+kA+' شهراً':'، ولا تكتمل الكل خلال 20 سنة')+'.'+(dc?' الاحتساب يعتمد على تواريخ عمود «'+dc.name+'».':' لا يوجد عمود تاريخ في الملف، لذلك الاحتساب يفترض أن العناصر غير المكتملة تبدأ بعد فترة التأخير المحددة أدناه.')+(pc.type!=='percent'?' (تم تطبيع عمود «'+pc.name+'» بين أدنى وأعلى قيمة لتقدير نسبة التقدم).':'');
  box.innerHTML='<div class="n" style="margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center"><label>معدل التقدم الشهري <input type="range" id="rt" min="1" max="25" step="0.5" value="'+FC.rate+'"> <b>'+FC.rate+'%</b></label>'+(dc?'':'<label>تأخر بدء العناصر غير المبدوءة <input type="range" id="lg" min="0" max="18" step="1" value="'+FC.lag+'"> <b>'+FC.lag+'</b> شهر</label>')+'</div>'+svg+'<div class="n">'+note+'</div>';
  const rtEl=$('rt');if(rtEl)rtEl.oninput=e=>{FC.rate=+e.target.value;renderAll(true)};
  const lgEl=$('lg');if(lgEl)lgEl.oninput=e=>{FC.lag=+e.target.value;renderAll(true)};
}

/* ---------- generic charts ---------- */
function barCard(id,title,label,vals,total){
  const mx=Math.max(...vals.map(v=>v[1]),1);
  EX[id]={n:title,rows:[[label,'العدد','النسبة %']].concat(vals.map(([l,v])=>[l,v,Math.round(v/total*100)]))};
  const shown=vals.slice(0,15);
  const extra=vals.length>15?'<div class="n">+ '+(vals.length-15)+' فئة أخرى</div>':'';
  return'<div class="c"><h2>'+title+'<button class="e" data-k="'+id+'">⬇ Excel</button></h2><div class="bd">'+shown.map(([l,v])=>'<div class="r"><span>'+l+'</span><i><u style="width:'+(v/mx*100)+'%"></u></i><em>'+v+' ('+Math.round(v/total*100)+'%)</em></div>').join('')+extra+'</div></div>';
}
function categoryCard(col,rs){
  const counts={};
  rs.forEach(r=>{const v=getCat(r[col.idx])||'(فارغ)';counts[v]=(counts[v]||0)+1});
  const vals=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return barCard('cat'+col.idx,col.name,col.name,vals,rs.length||1);
}
function numDistCard(col,rs){
  const nums=rs.map(r=>getNum(r[col.idx])).filter(n=>n!=null);
  if(!nums.length)return'';
  let min=Math.min(...nums),max=Math.max(...nums);if(min===max)max=min+1;
  const bins=6,w=(max-min)/bins;
  const counts=Array(bins).fill(0);
  nums.forEach(n=>{let b=Math.floor((n-min)/w);if(b>=bins)b=bins-1;if(b<0)b=0;counts[b]++});
  const fmt=v=>col.type==='percent'?Math.round(v*100)+'%':(Math.round(v*100)/100);
  const vals=counts.map((c,i)=>[fmt(min+i*w)+' – '+fmt(min+(i+1)*w),c]);
  return barCard('num'+col.idx,col.name+' (توزيع)',col.name,vals,nums.length);
}

/* ---------- custom charts ---------- */
function mv(rs,col,agg){
  if(agg==='cnt')return rs.length;
  if(!col)return rs.length;
  const nums=rs.map(r=>getNum(r[col.idx])).filter(n=>n!=null);
  if(agg==='avg')return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*(col.type==='percent'?100:1)*100)/100:0;
  if(agg==='sum')return Math.round(nums.reduce((a,b)=>a+b,0)*100)/100;
  return rs.length;
}
function cu(rs){
  const cats=catCols();
  $('cu').innerHTML=CU.map((d,i)=>{
    const dim=cats.find(c=>c.idx==d.d)||cats[0];if(!dim)return'';
    const metCol=numCols().find(c=>c.idx==d.m);
    const groups={};
    rs.forEach(r=>{const v=getCat(r[dim.idx])||'(فارغ)';(groups[v]=groups[v]||[]).push(r)});
    const L=Object.entries(groups).map(([l,g])=>[l,mv(g,metCol,d.agg)]).sort((a,b)=>b[1]-a[1]).slice(0,15);
    const mx=Math.max(...L.map(a=>a[1]),1),tot=L.reduce((a,b)=>a+b[1],0),id='cu'+d.id;
    const metName=metCol?metCol.name+' ('+d.agg+')':'العدد';
    EX[id]={n:'شارت'+(i+1),rows:[[dim.name,metName]].concat(L)};
    let b='';
    if(d.t=='col')b='<div style="display:flex;align-items:flex-end;gap:6px;height:220px;min-width:max-content;font-size:10px;overflow-x:auto">'+L.map(([l,v])=>'<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:52px"><span>'+v+'</span><u style="display:block;width:26px;height:'+(v/mx*65)+'%;background:var(--ac);border-radius:4px 4px 0 0"></u><span style="color:var(--mu);text-align:center;margin-top:3px;height:28px;overflow:hidden">'+l+'</span></div>').join('')+'</div>';
    else if(d.t=='pie'){let a=0;const g=tot?L.filter(x=>x[1]>0).map((x,j)=>{const s=a;a+=x[1]/tot*100;return PAL[j%10]+' '+s+'% '+a+'%'}).join(','):'var(--bd) 0 100%';b='<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="width:150px;height:150px;border-radius:50%;flex:none;background:conic-gradient('+g+')"></div><div style="font-size:12px">'+L.filter(x=>x[1]>0).map((x,j)=>'<div><span style="color:'+PAL[j%10]+'">■</span> '+x[0]+': '+x[1]+'</div>').join('')+'</div></div>'}
    else b=L.map(([l,v])=>'<div class="r"><span>'+l+'</span><i><u style="width:'+(v/mx*100)+'%"></u></i><em>'+v+'</em></div>').join('');
    return'<div class="c'+(i==CU.length-1&&CU.length%2?' w':'')+'"><h2>'+metName+' حسب '+dim.name+'<span><button class="e" data-k="'+id+'">⬇ Excel</button> <button class="e" data-del="'+d.id+'">✕</button></span></h2><div class="bd">'+b+'</div></div>'}).join('')
}

/* ---------- table ---------- */
function tableCard(rs){
  const cols=DS.headers;
  EX.tb={n:'البيانات',rows:[cols].concat(rs.map(r=>r.map(v=>v instanceof Date?v.toLocaleDateString('ar'):v)))};
  const shown=rs.slice(0,150);
  return'<div class="c w"><h2>نتائج البحث <span>('+rs.length+')</span><button class="e" data-k="tb">⬇ Excel</button></h2><div class="bd tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+shown.map(r=>'<tr>'+r.map(v=>'<td>'+(v instanceof Date?v.toLocaleDateString('ar'):(v==null?'':v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(rs.length>150?'<div class="n">عرض أول 150 صف من '+rs.length+'</div>':'')+'</div>'
}

/* ---------- top bar & kpis ---------- */
function topBar(){
  const cats=catCols().slice(0,3);
  return'<div class="dz" id="dz"><b>📁 اسحب وأفلت ملف Excel هنا</b> أو اضغط للاختيار — أي ملف، أي أعمدة<input id="fi" type="file" accept=".xlsx,.xls,.csv" hidden></div>'+
  '<div class="bar"><input id="q" class="q" placeholder="🔍 ابحث في كل الأعمدة...">'+
  cats.map(c=>'<select data-f="'+c.idx+'"><option value="">'+c.name+' (الكل)</option>'+[...new Set(DS.rows.map(r=>getCat(r[c.idx])).filter(Boolean))].sort().map(v=>'<option value="'+v+'"'+(f[c.idx]===v?' selected':'')+'>'+v+'</option>').join('')+'</select>').join('')+
  '<button id="x">إعادة ضبط</button><button id="nw">➕ شارت جديد</button><button class="e" id="ea">⬇ تصدير الكل</button></div>';
}
function kpis(rs){
  const nc=numCols().slice(0,4);
  const tiles=[[rs.length,'إجمالي الصفوف']].concat(nc.map(c=>{
    const nums=rs.map(r=>getNum(r[c.idx])).filter(n=>n!=null);
    const avg=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:0;
    return[c.type==='percent'?Math.round(avg*100)+'%':Math.round(avg*100)/100,'متوسط '+c.name];
  }));
  EX.k={n:'المؤشرات',rows:[['المؤشر','القيمة']].concat(tiles.map(a=>[a[1],a[0]]))};
  return'<div class="kpis">'+tiles.map(a=>'<div class="k"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('')+'</div>';
}

/* ---------- new chart builder panel ---------- */
function newChartPanel(){
  const cats=catCols(),nums=numCols();
  return'<div class="c" id="nb" style="display:none;height:auto;margin-bottom:10px"><h2>إنشاء شارت جديد</h2><div class="bar">'+
  '<select id="nd">'+cats.map(c=>'<option value="'+c.idx+'">'+c.name+'</option>').join('')+'</select>'+
  '<select id="nm"><option value="">عدد الصفوف</option>'+nums.map(c=>'<option value="'+c.idx+'">متوسط '+c.name+'</option>').join('')+'</select>'+
  '<select id="nt"><option value="bar">أعمدة أفقية</option><option value="col">أعمدة رأسية</option><option value="pie">دائري</option></select>'+
  '<button id="na">إضافة</button></div></div>';
}

/* ---------- render ---------- */
function renderAll(keepScroll){
  if(!DS)return;
  const app=$('app');
  const rs=filteredRows();
  let html=topBar()+kpis(rs)+newChartPanel();
  html+='<div class="grid"><div class="c w"><h2>تنبؤ — 12 شهراً القادمة</h2><div class="bd" id="fcbox"></div></div>';
  const cats=catCols().filter(c=>c.distinct>=2).slice(0,6);
  cats.forEach(c=>html+=categoryCard(c,rs));
  numCols().slice(0,3).forEach(c=>{const card=numDistCard(c,rs);if(card)html+=card});
  html+=tableCard(rs);
  html+='<div id="cu" style="display:contents"></div></div>';
  app.innerHTML=html;
  renderForecast(rs);
  cu(rs);
  wireEvents();
}

function wireEvents(){
  const q=$('q');if(q)q.oninput=()=>renderAll(true);
  document.querySelectorAll('[data-f]').forEach(sel=>{sel.onchange=e=>{f[e.target.dataset.f]=e.target.value;renderAll(true)}});
  const x=$('x');if(x)x.onclick=()=>{f={};renderAll()};
  const nw=$('nw');if(nw)nw.onclick=()=>{const p=$('nb');p.style.display=p.style.display==='none'?'block':'none'};
  const na=$('na');if(na)na.onclick=()=>{const d=+$('nd').value,mI=$('nm').value,m=mI===''?null:+mI,t=$('nt').value;CU.push({id:Date.now(),d,m,agg:'avg',t});svCU();$('nb').style.display='none';renderAll(true)};
  const fi=$('fi');if(fi)fi.onchange=handleFile;
  const dz=$('dz');
  if(dz){
    dz.onclick=()=>$('fi')&&$('fi').click();
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};
    dz.ondragleave=()=>dz.classList.remove('drag');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
  }
}
async function handleFile(e){const fl=e.target.files[0];if(fl)await loadFile(fl);e.target.value=''}
async function loadFile(fl){
  await waitXLSX();
  if(typeof XLSX==='undefined'){alert('تعذّر تحميل مكتبة قراءة Excel من الإنترنت. تحقق من الاتصال ثم أعد المحاولة.');return}
  try{
    const buf=await fl.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const{headers,rows}=parseWorkbook(wb);
    if(!headers.length||!rows.length)throw new Error('الملف فارغ أو غير مقروء');
    loadDataset(headers,rows,fl.name);
  }catch(err){alert('تعذّر تحليل الملف: '+err.message)}
}
async function waitXLSX(){for(let w=0;w<25&&typeof XLSX=='undefined';w++)await new Promise(r=>setTimeout(r,200))}

/* ---------- export ---------- */
async function ex(ks){
  ks=ks.filter(k=>EX[k]);if(!ks.length)return;
  await waitXLSX();
  if(typeof XLSX=='undefined'){alert('تعذّر تحميل مكتبة تصدير Excel (XLSX) من الإنترنت. تأكد من اتصالك بالإنترنت، أو أن أي أداة حجب إعلانات/محتوى لا تمنع تحميل ملفات JS خارجية، ثم أعد تحميل الصفحة وحاول مجدداً.');return}
  const wb=XLSX.utils.book_new();
  ks.forEach(k=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(EX[k].rows),EX[k].n.slice(0,31)));
  wb.Workbook={Views:[{RTL:true}]};
  const fn=(ks.length>1?'تصدير-كل-الجداول':EX[ks[0]].n)+'.xlsx';
  try{if(typeof claude!=='undefined'&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});return}}}catch(e){}
  try{const arr=XLSX.write(wb,{type:'array',bookType:'xlsx'});const blob=new Blob([arr],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('تعذر التصدير: '+e.message)}
}
document.addEventListener('click',e=>{
  const t=e.target;
  const k=t.dataset&&t.dataset.k;if(k)ex([k]);
  if(t.id=='ea')ex(Object.keys(EX));
  if(t.dataset&&t.dataset.del){CU=CU.filter(d=>d.id!=t.dataset.del);svCU();renderAll(true)}
});

/* ---------- init ---------- */
(function init(){
  let loaded=false;
  try{
    const s=JSON.parse(localStorage.getItem('gd_data')||'null');
    if(s&&s.headers&&s.rows){
      const rows=s.rows.map(r=>r.map(v=>{if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(v)){const d=new Date(v);return isNaN(d)?v:d}return v}));
      loadDataset(s.headers,rows,s.name+' (محفوظ)');
      loaded=true;
    }
  }catch(_){}
  if(!loaded){
    const rows=DEFAULT_DS.rows.map(r=>r.map(v=>{if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(v)){const d=new Date(v);return isNaN(d)?v:d}return v}));
    loadDataset(DEFAULT_DS.headers,rows,'تحديث مشاريع بهجة (نموذج افتراضي)');
  }
})();

</script>
